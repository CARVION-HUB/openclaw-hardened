# ============================================================
# docker-compose.override.yml -- DEVELOPMENT ONLY
# Carregado automaticamente junto com docker-compose.yml
# NAO use em producao.
# ============================================================

services:
  openclaw-gateway:
    # Acesso direto ao gateway em localhost para desenvolvimento
    ports:
      - "127.0.0.1:18789:18789"
      - "127.0.0.1:18790:18790"
    environment:
      - HOME=/home/node
      - TERM=xterm-256color
      - NODE_ENV=development
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN}
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G

  caddy:
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
